# The repository's first automated opinion about itself.
#
# Everything here already existed as something a person ran by hand and read
# with their eyes. That is a fine way to check a change and a poor way to build
# anything on top of, because the result lives in a terminal that scrolls away
# and in a memory of having run it. What follows is the same work, run by
# something that does not forget, leaving a `test-report.json` behind that can
# be read by whatever comes next.
#
# Two jobs, and the split is deliberate. `tests` is the fast one: it needs
# nothing but Node and it is where nearly every regression will actually be
# caught. `android` is slow and needs an SDK, and it exists because for a long
# time nothing at all checked the Kotlin in `app/modules` — not a test, not a
# linter, not even a compiler. A typo in there reached a phone or it reached
# nobody.
#
# That job now compiles, runs the JVM tests of the two modules that have them,
# and lints. The tests matter more than the compile: `Outbox` and `Backlog`
# hold the promise that a reply typed into a notification and an SMS that
# arrived at three in the morning are still there when the desktop comes back,
# and a compiler has no opinion about whether they still do.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # So the slow half can be tried on its own without pushing a commit to ask.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer stale rather
# than interesting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `daemon/package.json` asks for >=20; this is what the work is done
          # on locally, and the app's suites lean on Node's own type stripping
          # to import `.ts` directly, which is only unflagged from 22.18.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            daemon/package-lock.json
            app/package-lock.json

      - name: install daemon
        working-directory: daemon
        run: npm ci

      - name: install app
        working-directory: app
        run: npm ci

      # The whole point of the runner: every suite runs, including the ones
      # after the first failure. A red build here names everything that is
      # broken, not the first thing that was.
      - name: test
        run: node tools/run-tests.mjs

      - name: typecheck
        working-directory: app
        run: npm run typecheck

      # Kept whether the run passed or failed — a report is only worth writing
      # down on the days it has something to say.
      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
          if-no-files-found: warn

  android:
    name: kotlin compiles and passes
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: install app
        working-directory: app
        run: npm ci

      # This is a managed Expo project: there is no `android/` directory in the
      # repository, it is generated. `--no-install` because npm ci above has
      # already done that half.
      - name: prebuild
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      # Compiling and not assembling. An APK takes far longer and answers a
      # question nobody asked here — what is wanted is whether the Kotlin in
      # `modules/omarchy-link` and `modules/omarchy-telephony` is still valid
      # Kotlin, and that is the compile task.
      - name: compile
        working-directory: app/android
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      # The part that can actually catch a lost message. Robolectric runs the
      # real `SharedPreferences` and the real `org.json` inside the JVM, so
      # these are the same code paths the phone takes, minus the phone.
      #
      # A separate step from the compile so that a red build says which of the
      # two it was without anybody opening the log.
      - name: unit tests
        working-directory: app/android
        run: ./gradlew :omarchy-link:testDebugUnitTest :omarchy-telephony:testDebugUnitTest --no-daemon --stacktrace

      # Both modules used to carry `lintOptions { abortOnError false }`, which
      # made lint a thing that printed. It now stops the build, held against a
      # baseline committed next to each `build.gradle`: what was already there
      # is forgiven, anything new is not.
      - name: lint
        working-directory: app/android
        run: ./gradlew :omarchy-link:lintDebug :omarchy-telephony:lintDebug --no-daemon --stacktrace

      # A failing test names itself in the log, but the HTML and XML reports
      # say which assertion and with what values, which is the difference
      # between reading a CI failure and reproducing it.
      - name: reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/modules/*/android/build/reports/
            app/modules/*/android/build/test-results/
          if-no-files-found: warn
